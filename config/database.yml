# Every environment reads DATABASE_URL. Sessions run in UTC (spec/README.md).
default: &default
  adapter: postgresql
  url: <%= ENV.fetch("DATABASE_URL", "postgres://tadmor:tadmor@127.0.0.1:5432/tadmor_ruby") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  variables:
    timezone: UTC

development:
  <<: *default

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://tadmor:tadmor@127.0.0.1:5432/tadmor_ruby_test") %>

production:
  <<: *default
